# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=0.0
group=tallestred.blockplaceparticles
java_version=17

# Common
mod_version=1.0.0
mod_name=Particle Interactions
mod_author=TallestRed, Enchanted_Games for original version
mod_id=eg_particle_interactions
license=CC BY-NC 4.0
credits=
description=A client side mod that adds particles to various interactions in the game that dont normally have particles.\
\nNew in v0.4:\
\nv0.4 includes a bunch of new particles, some graphical improvements, and a bit of extra polish\
\n\  - New Heavy Grass Blade, Moss Clump, Pale Moss Clump, and Dust Block Particle Overrides\
\n\  - A variety of graphical improvements to spark particles\
\n\  - New general / compatibility config tab with some new options and some previously hidden ones\
\n\  - Block and Item particles are now pixel consistent - more info and option to disable this is in the config menu\
\n\  - Spark effects when combining items in an anvil and when disenchanting items in a grindstone\
\n\  - Dust particles now spawn when brushing blocks that dont have a Block Particle Override set. Can be disabled in the config like everything else!\
\n\  - Sparks now spawn randomly from blazes and when they are hurt\
\n\  - And more I probably forgot to mention!
mod_homepage=https://my.ass
mod_issues=https://github.com/seymourimadeit/block-place-particles-1.20.1/issues
#mod_source only used in fabric mod json
mod_source=https://github.com/seymourimadeit/block-place-particles-1.20.1
minecraft_version_range=[1.20,1.20.1]
minecraft_version=1.20.1

# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.20.1
parchment_version=2023.09.03

# Yet Another Config Lib & ModMenu
yacl_version=3.6.6+1.20.1
modmenu_version=7.1.0

# Fabric
fabric_version=0.92.1+1.20.1
fabric_loader_version=0.16.9

# Forge
forge_version=47.3.12
forge_loader_version_range=[46,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
